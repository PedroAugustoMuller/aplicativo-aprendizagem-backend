# Production server. Only Cloudflare reaches this port (Oracle Security List),
# so the certificate is a Cloudflare Origin Certificate and the real client IP
# comes from CF-Connecting-IP — trusted only from Cloudflare's own ranges
# (cloudflare-ips.conf). php-fpm then sees the real client as REMOTE_ADDR and
# Laravel trusts no proxy at all.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/cloudflare-ips.conf;

    server_tokens off;
    client_max_body_size 1M;

    gzip on;
    gzip_types application/json text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Floods only. Per-token and per-login limits stay in Laravel.
    limit_req zone=per_ip burst=40 nodelay;
    limit_req_status 429;

    # The code lives only in the app image, so nothing is served from disk
    # here: every request goes to Laravel's front controller.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }
}
