; Production PHP settings. Differs from php.ini only where production must:
; code is baked into the image, so opcache never re-checks files, and the API
; accepts JSON only, so request bodies are capped at 1M (matching nginx).
memory_limit = 512M
upload_max_filesize = 1M
post_max_size = 1M
max_execution_time = 60

display_errors = Off
log_errors = On
error_reporting = E_ALL

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

date.timezone = America/Sao_Paulo
